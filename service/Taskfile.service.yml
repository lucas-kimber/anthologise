# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  MAIN_PATH: cmd/anthologise/main.go
  SERVICE_NAME: service

tasks:

  default:
    cmds:
      - task --taskfile "{{.TASKFILE}}" --list
    silent: true

  runlocal:
    desc: Tidy and run the backend service locally, without Docker.
    dir: ./{{.SERVICE_NAME}}
    cmds:
      - go mod tidy
      - go run {{.MAIN_PATH}}
  
  envinit:
    desc: Create the service's local environment file.
    dir: ./service
    cmds:
      - cp .env.example .env.local
    
  test:
    desc: Run the service's test cases.
    dir: ./service
    dotenv: [".env.test"]
    cmds:
      - go test ./...
    
  lint:
    desc: Run staticcheck and go vet on the service.
    dir: ./service
    cmds:
      - go vet ./...
      - go tool staticcheck ./...
      - cmd: echo "Service passed lint check"
        silent: true