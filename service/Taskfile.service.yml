# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  COMPOSE_SERVICE: service

tasks:

  default:
    cmds:
      - task --taskfile "{{.TASKFILE}}" --list
    silent: true

  build:
    desc: Build the backend service image
    cmds:
      - docker compose build {{.COMPOSE_SERVICE}}

  up:
    desc: Build and run the backend service
    cmds:
      - docker compose up --build --detach {{.COMPOSE_SERVICE}}

  stop:
    desc: Stop the backend service
    cmds:
      - docker compose stop {{.COMPOSE_SERVICE}}

  remove:
    desc: Stop and remove the backend service container
    cmds:
      - docker compose rm --stop --force {{.COMPOSE_SERVICE}}

  logs:
    desc: Follow the backend service logs
    cmds:
      - docker compose logs --follow {{.COMPOSE_SERVICE}}