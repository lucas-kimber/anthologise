# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  MAIN_PATH: cmd/anthologise/main.go
  SERVICE_NAME: service

tasks:

  default:
    cmds:
      - task --taskfile "{{.TASKFILE}}" --list
    silent: true

  build:
    desc: Build the backend service image
    cmds:
      - docker compose build {{.SERVICE_NAME}}

  up:
    desc: Build and run the backend service
    cmds:
      - docker compose up --build --detach {{.SERVICE_NAME}}

  stop:
    desc: Stop the backend service
    cmds:
      - docker compose stop {{.SERVICE_NAME}}

  remove:
    desc: Stop and remove the backend service container
    cmds:
      - docker compose rm --stop --force {{.SERVICE_NAME}}

  logs:
    desc: Follow the backend service logs
    cmds:
      - docker compose logs --follow {{.SERVICE_NAME}}
  
  runlocal:
    desc: Tidy and run the backend service locally, without Docker.
    dir: ./{{.SERVICE_NAME}}
    cmds:
      - go mod tidy
      - go run {{.MAIN_PATH}}
  
  envinit:
    desc: Create the service's local environment file.
    dir: ./service
    cmds:
      - cp .env.example .env.local
    
  test:
    desc: Run the service's test cases.
    dir: ./service
    env:
      ANTHOLOGISE_LOG_LEVEL: debug
    cmds:
      - go test ./...
    
  lint:
    desc: Run staticcheck and go vet on the service.
    dir: ./service
    cmds:
      - go vet ./...
      - go tool staticcheck ./...
      - cmd: echo "Service passed lint check"
        silent: true