name: Lint and Test Anthologise Service

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "service/**"
      - "compose.yml"
      - "Taskfile.yml"
      - ".github/workflows/service-tests.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "service/**"
      - "compose.yml"
      - "Taskfile.yml"
      - ".github/workflows/service-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Go Setup
        uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - name: Taskfile Setup
        uses: go-task/setup-task@v1

      - name: Lint
        run: task lint

      - name: Unit Tests
        run: task test
      
      - name: Integration Tests
        run: task service:test:integration