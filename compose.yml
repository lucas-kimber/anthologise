name: anthologise

services:
  postgres-test:
    image: postgres:14.24-alpine3.23

    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: anthologise_test

    ports:
      - "5433:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d anthologise_test"]
      interval: 1s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ./service
      dockerfile: Dockerfile
      args:
        ENTRY_POINT: ./cmd/anthologise

    environment:
      - ANTHOLOGISE_STREMIO_ID
      - ANTHOLOGISE_VERSION_NUMBER
      - ANTHOLOGISE_APP_NAME
      - ANTHOLOGISE_MANIFEST_DESCRIPTION
      - ANTHOLOGISE_LOGO_URL
      - ANTHOLOGISE_MAIN_CATALOG_NAME
      - ANTHOLOGISE_PORT
      - ANTHOLOGISE_DATABASE_URL
      - ANTHOLOGISE_LOG_LEVEL

    ports:
      - "${ANTHOLOGISE_PORT}:${ANTHOLOGISE_PORT}"

    depends_on:
      postgres-test:
        condition: service_healthy